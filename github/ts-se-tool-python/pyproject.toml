[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-se-tool-python"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "mypy>=1.14", "pyinstaller>=6.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
